# Configuración del panel Pages CMS (https://app.pagescms.org)
# Las notas, autoras y eventos se guardan en src/content/ y las imágenes en public/media/.

media:
  input: public/media
  output: /media
  categories: [image]

content:
  - name: notas
    label: Notas
    type: collection
    path: src/content/notas
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: false
    view:
      primary: titulo
      fields: [titulo, fecha, autora, borrador]
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: fecha
        label: Fecha
        type: date
        required: true
      - name: autora
        label: Autora
        type: reference
        required: true
        description: Elige tu perfil. Tu nombre y tu foto salen en la nota.
        options:
          collection: autoras
          value: "{path}"
          label: "{nombre}"
      - name: categoria
        label: Categoría
        type: select
        options:
          values: [Noticia, Opinión, Comunidad, Eventos]
      - name: resumen
        label: Resumen
        type: text
        description: Una o dos frases. Sale en la lista de notas.
      - name: portada
        label: Imagen de portada
        type: image
        description: Súbela liviana (menos de 500 KB si se puede).
        options:
          rename: safe
      - name: borrador
        label: Borrador (todavía no publicar)
        type: boolean
        default: false
        description: Márcalo si la nota no está lista. No saldrá en la web hasta que lo desmarques.
      - name: body
        label: Texto de la nota
        type: rich-text

  - name: autoras
    label: Autoras
    type: collection
    path: src/content/autoras
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: nombre
      fields: [nombre, usuario, rol]
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
      - name: usuario
        label: Usuario o nick
        type: string
      - name: rol
        label: Rol en Aquelarre
        type: string
      - name: foto
        label: Foto de perfil
        type: image
        description: Cuadrada y liviana. Se ve pequeñita junto a tus notas.
        options:
          rename: safe

  - name: eventos
    label: Eventos
    type: collection
    path: src/content/eventos
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: nombre
      fields: [nombre, fecha, tipo, destacado]
    fields:
      - name: nombre
        label: Nombre del evento
        type: string
        required: true
      - name: fecha
        label: Fecha (o primer día)
        type: date
        required: true
        description: En la web solo se ve el mes y el año.
      - name: tipo
        label: Tipo
        type: select
        required: true
        options:
          values: [Evento, Torneo, Activación, Contenido]
      - name: lugar
        label: Lugar
        type: string
        description: Por ejemplo «La Mecánica», «ComicCon Bogotá» u «Online».
      - name: ciudad
        label: Ciudad
        type: string
      - name: resumen
        label: Resumen
        type: text
        description: Una frase. Sale al pasar el mouse por la foto y arriba en la página del evento.
      - name: portada
        label: Foto de portada
        type: image
        description: La que sale en el álbum. Mejor una foto con gente.
        options:
          rename: safe
      - name: fotos
        label: Fotos del evento
        type: image
        list: true
        description: Todas las que quieran mostrar en la página del evento. Livianas, por favor.
        options:
          rename: safe
      - name: destacado
        label: Destacar arriba en «Lo que hemos hecho»
        type: boolean
        default: false
      - name: borrador
        label: Borrador (todavía no publicar)
        type: boolean
        default: false
      - name: body
        label: Qué pasó
        type: rich-text
